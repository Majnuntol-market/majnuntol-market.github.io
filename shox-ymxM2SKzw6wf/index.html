<!doctype html>
<html lang="uz"><head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Majnuntol Market</title>
<meta name="robots" content="noindex,nofollow">
<link rel="icon" href="../icon-192.png">
<link rel="stylesheet" href="../app.css">
<script>
/* Eski ilova nusxasini telefondan butunlay tozalaydi */
try{if('serviceWorker' in navigator)navigator.serviceWorker.getRegistrations().then(function(r){r.forEach(function(x){x.unregister()})})}catch(e){}
try{if(window.caches)caches.keys().then(function(k){k.forEach(function(n){caches.delete(n)})})}catch(e){}
try{localStorage.clear();sessionStorage.clear()}catch(e){}
</script>
</head><body>
<div class="wrap"><header><span class="shop">Majnuntol Market</span><h1>Ilova yopilgan</h1></header>
<section class="card"><p class="hint" style="color:var(--fg);line-height:1.5">Bu sahifa endi ishlamaydi. Ilovani telefoningizdan o'chirib tashlashingiz mumkin.</p></section></div>
</body></html>
