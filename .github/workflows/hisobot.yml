name: Spiskalar hisoboti

on:
  schedule:
    - cron: "0 16 * * *"   # har kuni 16:00 UTC = 21:00 Toshkent
  workflow_dispatch:        # Actions sahifasidan qo'lda ishga tushirish
    inputs:
      dry_run:
        description: "Kanalga yubormasdan faqat tekshirish (1 = ha)"
        default: "0"
      clear_only:
        description: "Navbatni tozalash — hisobot yubormasdan (1 = ha)"
        default: "0"

permissions:
  contents: read

concurrency:
  group: hisobot
  cancel-in-progress: false

jobs:
  hisobot:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - name: Hisobot tayyorlash va kanalga yuborish
        env:
          TG_BOT_TOKEN: ${{ secrets.TG_BOT_TOKEN }}
          TG_CHANNEL_ID: ${{ secrets.TG_CHANNEL_ID }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          GEMINI_MODEL: ${{ vars.GEMINI_MODEL }}
          DRY_RUN: ${{ github.event.inputs.dry_run }}
          CLEAR_ONLY: ${{ github.event.inputs.clear_only }}
        run: python3 hisobot/hisobot.py
