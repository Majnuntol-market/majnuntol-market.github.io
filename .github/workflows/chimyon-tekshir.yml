name: ChimyonSuvBot tekshiruvi

on:
  workflow_dispatch:   # faqat qo'lda ishga tushiriladi

permissions:
  contents: read

jobs:
  tekshir:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v5
      - name: Bot qayerga ulanganini aniqlash
        env:
          CHIMYON_BOT_TOKEN: ${{ secrets.CHIMYON_BOT_TOKEN }}
        run: python3 hisobot/chimyon_tekshir.py
