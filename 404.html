<!doctype html>
<html lang="uz"><head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Majnuntol Market</title>
<meta name="robots" content="noindex">
<link rel="icon" href="/icon-192.png">
<link rel="stylesheet" href="/app.css">
<script>
/* Manzil katta-kichik harf xatosi bilan yozilsa, to'g'ri sahifaga o'tkazadi */
(function(){
  var pages=['daftar','rahbar'];
  var p=location.pathname.replace(/^\/+|\/+$/g,'').split('/')[0].toLowerCase().replace(/\s+/g,'');
  for(var i=0;i<pages.length;i++){
    if(pages[i].toLowerCase()===p){location.replace('/'+pages[i]+'/');return}
  }
})();
</script>
</head><body>
<div class="wrap"><header><span class="shop">Majnuntol Market</span><h1>Sahifa topilmadi</h1></header>
<section class="card"><p class="hint" style="color:var(--fg);line-height:1.5">Havola noto'g'ri yozilgan bo'lishi mumkin. Rahbar Telegram orqali yuborgan havolani bevosita bosib oching, qo'lda yozmang.</p></section></div>
</body></html>
